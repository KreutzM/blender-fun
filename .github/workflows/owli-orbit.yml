name: Owli | 315 degree speaking avatar orbit

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/owli-orbit.yml'
      - 'scripts/animate_owli_orbit.py'
      - 'scripts/check_owli_orbit.py'
      - 'scripts/rig_owli.py'
      - 'scenes/owli.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  orbit:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    env:
      BLENDER_VERSION: '4.5.15'
      OWLI_ORBIT_SCALE: '68'
      OWLI_ORBIT_SAMPLES: '4'
      OWLI_ORBIT_FPS: '6'
    steps:
      - uses: actions/checkout@v4
      - name: Install Blender libraries and FFmpeg
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends ffmpeg libgl1 libxi6 libxrender1 libxrandr2 libxinerama1 libxcursor1 libxkbcommon-x11-0
      - name: Download Blender 4.5.15 and verify checksum
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          archive="blender-${BLENDER_VERSION}-linux-x64.tar.xz"
          getfile() {
            local file="$1" mirror
            for mirror in \
              "https://mirror.clarkson.edu/blender/release/Blender4.5" \
              "https://mirror.blender.org/release/Blender4.5" \
              "https://download.blender.org/release/Blender4.5"; do
              echo "Trying $mirror/$file"
              if curl -fLSs --retry 2 --retry-delay 3 --max-time 600 "$mirror/$file" -o "$file"; then return 0; fi
              rm -f "$file"
            done
            return 1
          }
          getfile "$archive"
          getfile "blender-${BLENDER_VERSION}.sha256"
          grep -F " $archive" "blender-${BLENDER_VERSION}.sha256" | head -n 1 | sha256sum -c -
          tar -xJf "$archive"
          "$RUNNER_TEMP/blender-${BLENDER_VERSION}-linux-x64/blender" --version
      - name: Render speaking Owli from the orbit camera
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p output/owli_orbit
          "$RUNNER_TEMP/blender-${BLENDER_VERSION}-linux-x64/blender" \
            --background --factory-startup --threads 4 \
            --python scripts/animate_owli_orbit.py \
            > output/owli_orbit/render.log 2>&1 || {
              tail -n 140 output/owli_orbit/render.log; exit 1;
            }
          tail -n 45 output/owli_orbit/render.log
      - name: Create H.264 video and contact sheet
        shell: bash
        run: |
          set -euo pipefail
          test "$(find output/owli_orbit/frames -name 'frame_*.png' | wc -l)" -ge 60
          ffmpeg -hide_banner -nostdin -y -loglevel warning \
            -framerate 6 -i output/owli_orbit/frames/frame_%04d.png \
            -vf "minterpolate=fps=24:mi_mode=mci:mc_mode=obmc:me_mode=bidir,scale=720:720:flags=lanczos,format=yuv420p" \
            -c:v libx264 -preset fast -crf 20 -movflags +faststart \
            output/owli_orbit/owli_orbit_speaking.mp4
          ffmpeg -hide_banner -nostdin -y -loglevel error \
            -pattern_type glob -i 'output/owli_orbit/shot_*.png' \
            -vf 'scale=360:360:flags=lanczos,tile=5x1' -frames:v 1 \
            output/owli_orbit/owli_orbit_storyboard.png
      - name: Validate video and Blender orbit project
        run: python3 scripts/check_owli_orbit.py output/owli_orbit
      - name: Publish video, storyboard and editable Blender project
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: owli-speaking-orbit-${{ github.run_number }}
          path: |
            output/owli_orbit/*.mp4
            output/owli_orbit/*.blend
            output/owli_orbit/*.png
            output/owli_orbit/*.json
            output/owli_orbit/*.log
          if-no-files-found: warn
          retention-days: 30
