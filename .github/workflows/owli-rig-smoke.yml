name: Owli | fast rig validation

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/owli-rig-smoke.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  animate:
    runs-on: ubuntu-24.04
    timeout-minutes: 24
    env:
      BLENDER_VERSION: '4.5.15'
      OWLI_RIG_SCALE: '50'
      OWLI_RIG_SAMPLES: '2'
      OWLI_RIG_FPS: '4'
      OWLI_NO_DENOISE: '1'
      OWLI_VIEWS: '0'
    steps:
      - name: Checkout code and model parameters
        uses: actions/checkout@v4
      - name: Install FFmpeg and Blender runtime
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends blender ffmpeg libgl1 libxi6 libxrender1 libxrandr2 libxinerama1 libxcursor1 libxkbcommon-x11-0
      - name: Build bone rig and render character poses
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p output/owli_rig
          blender="blender"
          "$blender" --background --factory-startup --threads 4 \
            --python scripts/rig_owli.py > output/owli_rig/rig.log 2>&1 || {
              tail -n 100 output/owli_rig/rig.log; exit 1;
            }
          tail -n 30 output/owli_rig/rig.log
      - name: Encode MP4 and create pose-sheet
        shell: bash
        run: |
          set -euo pipefail
          test "$(find output/owli_rig/frames -name 'frame_*.png' | wc -l)" -ge 24
          ffmpeg -hide_banner -nostdin -loglevel error -y \
            -framerate 4 -i output/owli_rig/frames/frame_%04d.png \
            -vf 'fps=24,scale=720:720:flags=lanczos,format=yuv420p' \
            -c:v libx264 -preset fast -crf 19 -movflags +faststart \
            output/owli_rig/owli_animation.mp4
          ffmpeg -hide_banner -nostdin -loglevel error -y \
            -pattern_type glob -i 'output/owli_rig/pose_*.png' \
            -vf 'scale=480:480:flags=lanczos,tile=4x1' -frames:v 1 \
            output/owli_rig/pose_sheet.png
      - name: Verify editable rig, animation and all output files
        run: python3 scripts/check_owli_rig.py output/owli_rig
      - name: Publish finished Owli rig and video
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: owli-rig-smoke-${{ github.run_number }}-${{ github.run_attempt }}
          path: |
            output/owli_rig/*.blend
            output/owli_rig/*.png
            output/owli_rig/*.mp4
            output/owli_rig/*.json
            output/owli_rig/*.log
          if-no-files-found: warn
          retention-days: 30
