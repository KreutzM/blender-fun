name: Owli | speaking beak and viseme demo

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/owli-speech.yml'
      - 'scripts/animate_owli_speech.py'
      - 'scripts/check_owli_speech.py'
      - 'scripts/rig_owli.py'
      - 'scenes/owli.py'
      - 'config/owli.json'
      - 'config/owli_speech_demo.json'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  speaking:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    env:
      BLENDER_VERSION: '4.5.15'
      OWLI_SPEECH_FPS: '8'
      OWLI_SPEECH_SAMPLES: '5'
      OWLI_SPEECH_SCALE: '75'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install FFmpeg and Linux runtime libraries
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends ffmpeg libgl1 libxi6 libxrender1 libxrandr2 libxinerama1 libxcursor1 libxkbcommon-x11-0
      - name: Download Blender 4.5.15 and verify checksum
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          archive="blender-${BLENDER_VERSION}-linux-x64.tar.xz"
          getfile() {
            local file="$1" mirror
            for mirror in \
              "https://mirror.clarkson.edu/blender/release/Blender4.5" \
              "https://mirror.blender.org/release/Blender4.5" \
              "https://download.blender.org/release/Blender4.5"; do
              echo "Trying $mirror/$file"
              if curl -fLSs --retry 2 --retry-delay 3 --max-time 600 "$mirror/$file" -o "$file"; then return 0; fi
              rm -f "$file"
            done
            return 1
          }
          getfile "$archive"
          getfile "blender-${BLENDER_VERSION}.sha256"
          grep -F " $archive" "blender-${BLENDER_VERSION}.sha256" | head -n 1 | sha256sum -c -
          tar -xJf "$archive"
          "$RUNNER_TEMP/blender-${BLENDER_VERSION}-linux-x64/blender" --version
      - name: Create speaking Owli rig and render viseme sequence
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p output/owli_speech
          blender="$RUNNER_TEMP/blender-${BLENDER_VERSION}-linux-x64/blender"
          "$blender" --background --factory-startup --threads 4 \
            --python scripts/animate_owli_speech.py \
            > output/owli_speech/speech.log 2>&1 || {
              tail -n 110 output/owli_speech/speech.log; exit 1;
            }
          tail -n 35 output/owli_speech/speech.log
      - name: Make speaking MP4 and beak contact sheet
        shell: bash
        run: |
          set -euo pipefail
          test "$(find output/owli_speech/frames -name 'frame_*.png' | wc -l)" -ge 40
          ffmpeg -hide_banner -nostdin -loglevel error -y \
            -framerate 8 -i output/owli_speech/frames/frame_%04d.png \
            -vf 'fps=24,scale=720:720:flags=lanczos,format=yuv420p' \
            -c:v libx264 -preset fast -crf 19 -movflags +faststart \
            output/owli_speech/owli_speech_demo.mp4
          ffmpeg -hide_banner -nostdin -loglevel error -y \
            -pattern_type glob -i 'output/owli_speech/mouth_*.png' \
            -vf 'scale=420:420:flags=lanczos,tile=4x1' -frames:v 1 \
            output/owli_speech/mouth_contact_sheet.png
      - name: Verify geometry, visemes and actual video
        run: python3 scripts/check_owli_speech.py output/owli_speech
      - name: Publish speech rig, MP4 and test stills
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: owli-speech-${{ github.run_number }}-${{ github.run_attempt }}
          path: |
            output/owli_speech/*.blend
            output/owli_speech/*.mp4
            output/owli_speech/*.png
            output/owli_speech/*.json
            output/owli_speech/*.log
          if-no-files-found: warn
          retention-days: 30
